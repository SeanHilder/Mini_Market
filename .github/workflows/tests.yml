name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mini_market
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mini_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_market -d mini_market_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mini_market:ci-only-password@127.0.0.1:5432/mini_market_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m scripts.load_test --requests 40 --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-load-results
          path: instance/load-results.json
