name: mini-market
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mini_market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: mini_market
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_market -d mini_market"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
