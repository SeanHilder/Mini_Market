{% extends 'base.html' %}
{% block title %}{{ error.code }} · Mini Market{% endblock %}
{% block content %}<section class="empty-state">
<p class="eyebrow">{{ error.code }}</p>
<h1>{% if error.code == 404 %}That page isn’t here.{% else %}Let’s try that again.{% endif %}</h1>
<p>{{ error.description }}</p>
<a class="button dark" href="{{ url_for('catalogue') }}">Back to the collection</a>
</section>{% endblock %}
